<!--
==================================================================
  BANNER TẠM DỪNG TUYỂN DỤNG — HR NhiLe Team
  
  Trang này hiển thị CHÍNH XÁC ảnh banner gốc team đã duyệt.
  Khi đến 01/06/2026, sẽ tự chuyển sang form đăng ký.
  
  📝 ĐỔI NGÀY MỞ LẠI: tìm "REOPEN_DATE" cuối file → sửa
==================================================================

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: #e8f0f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Ảnh banner - giữ tỉ lệ chuẩn, responsive đẹp */
  .banner-img {
    width: 100%;
    max-width: 1080px;
    height: auto;
    display: block;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(31, 71, 80, 0.12);
  }

  /* Form đăng ký - chỉ hiện sau ngày mở lại */
  .apply-form {
    display: none;
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 24px;
    padding: 56px 48px;
    box-shadow: 0 20px 60px rgba(31, 71, 80, 0.10);
  }
  .apply-form h2 {
    font-family: Georgia, serif;
    font-size: 36px;
    text-align: center;
    margin-bottom: 32px;
    color: #1f4750;
  }
  .apply-form .field { margin-bottom: 18px; }
  .apply-form label {
    display: block;
    font-size: 13px;
    color: #4a6b73;
    margin-bottom: 6px;
  }
  .apply-form input,
  .apply-form textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(44, 95, 107, 0.25);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: white;
    outline: none;
  }
  .apply-form input:focus, .apply-form textarea:focus { border-color: #2c5f6b; }
  .apply-form button {
    width: 100%;
    padding: 14px;
    background: #2c5f6b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }
</style>
</head>
